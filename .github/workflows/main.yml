name: Build Artifacts
on:
  push:

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0

    steps:
      #- name: install kicad
      #  run: |
      #    apt-get update
      #    apt-get install --yes software-properties-common
      #    add-apt-repository --yes ppa:kicad/kicad-9.0-releases
      #    apt-get update
      #    apt-get install --install-recommends kicad
      #    apt-get install libjpeg-dev zlib1g-dev
      - run: kicad-cli version
      - name: install kikit
        run: |
          sudo apt update
          sudo apt install python3-pip tree --yes
          sudo apt-get install --yes make cmark xsltproc librsvg2-bin
          pip install --break-system-packages --user kikit==1.5.1
          pip install --break-system-packages --user mistune==2.0.5 
          # FIXME: once this fix is merged, use plain pcbdraw
          pip install --break-system-packages --user git+https://github.com/vroland/PcbDraw@master
          export PATH="$HOME/.local/bin/:$PATH"
          kikit --version
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: build present page
        run: |
          export PATH="$HOME/.local/bin/:$PATH"
          make web
      - run: tree build/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build-artifacts

    # Deploy only on main
    if: github.ref == 'refs/heads/main' 

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

